name: Markdown Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  structure:
    name: Check Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required directories exist
        run: |
          for dir in principles standards/coding standards/testing standards/architecture patterns skills adapters evaluations/cases evaluations/runner templates docs/adr workflows registry governance runtime; do
            if [ ! -d "$dir" ]; then
              echo "Missing required directory: $dir"
              exit 1
            fi
          done
          echo "All required directories exist"

      - name: Verify key files exist
        run: |
          for file in README.md CONTRIBUTING.md CHANGELOG.md LICENSE; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files exist"

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            principles/**/*.md
            standards/**/*.md
            patterns/**/*.md
            skills/**/*.md
            adapters/**/*.md
            templates/**/*.md
            docs/**/*.md
            workflows/**/*.md
            governance/**/*.md
          config: |
            {
              "MD013": { "line_length": 120 },
              "MD033": false,
              "MD041": false
            }

  yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML structure
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: relaxed
            rules:
              line-length: disable
              document-start: disable

  symlinks:
    name: Check Symlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify symlinks point to valid targets
        run: |
          errors=0
          while IFS= read -r link; do
            if [ ! -e "$link" ] && [ ! -L "$link" ]; then
              echo "BROKEN SYMLINK: $link -> $(readlink "$link")"
              errors=$((errors + 1))
            fi
          done < <(find . -type l -not -path './.git/*')
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors broken symlinks"
            exit 1
          fi
          echo "All symlinks are valid"

  references:
    name: Check Internal References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify referenced files exist
        run: |
          errors=0
          # Find all markdown links to .md files (relative paths)
          while IFS= read -r file; do
            refs=$(grep -oP '(?<=\]\()[\w./-]+\.md(?=[^)]*\))' "$file" 2>/dev/null || true)
            while IFS= read -r ref; do
              # Skip external URLs
              case "$ref" in
                http*|https*) continue ;;
              esac
              # Resolve relative to file location
              dir=$(dirname "$file")
              target="$dir/$ref"
              if [ ! -f "$target" ]; then
                echo "BROKEN REF: $file -> $ref (resolved: $target)"
                errors=$((errors + 1))
              fi
            done <<< "$refs"
          done < <(find . -name '*.md' -not -path './.git/*')
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors broken references"
            exit 1
          fi
          echo "All internal references are valid"
