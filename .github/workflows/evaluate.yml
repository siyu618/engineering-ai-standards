name: Evaluate

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6:00 UTC
  workflow_dispatch:
    inputs:
      eval_suite:
        description: Evaluation suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - system-design
          - coding

jobs:
  evaluate:
    name: Run Evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Display evaluation structure
        run: |
          echo "=== Evaluation Structure ==="
          find evaluations -name "*.yaml" -not -path "*/runner/*" -not -path "*/schema*" -exec basename {} \; | sort
          echo ""
          echo "=== Suite: ${{ github.event.inputs.eval_suite || 'all' }} ==="

      - name: Run evaluation validation
        run: python evaluations/runner/run.py --verbose
