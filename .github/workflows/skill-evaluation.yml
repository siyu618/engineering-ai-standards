name: Skill Evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "registry/**"
      - "evaluations/**"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "registry/**"
      - "evaluations/**"
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6:00 UTC
  workflow_dispatch:
    inputs:
      eval_suite:
        description: Evaluation suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - system-design
          - coding

jobs:
  changed-skills:
    name: Detect Changed Skills
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      list: ${{ steps.detect.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed skill directories
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD^..HEAD -- skills/ 2>/dev/null || echo "")
          SKILLS=""
          if [ -n "$CHANGED" ]; then
            SKILLS=$(echo "$CHANGED" | grep -oP 'skills/\K[^/]+' | sort -u | jq -R -s -c 'split("\n")[:-1]')
          fi
          if [ "$SKILLS" = "" ] || [ "$SKILLS" = "[]" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "list=[]" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "list=$SKILLS" >> $GITHUB_OUTPUT
            echo "Changed skills: $SKILLS"
          fi

  validate:
    name: Validate Evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate evaluation case structure
        run: python evaluations/runner/run.py --verbose

  registry:
    name: Validate Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate registry YAML
        run: python -c "import yaml; data = yaml.safe_load(open('registry/skills.yaml')); skills = data.get('skills', {}); print(f'Registry OK: {len(skills)} skills registered'); [print(f'  - {k} v{v[\"version\"]} ({v.get(\"status\",\"unknown\")})') for k,v in skills.items()]"

      - name: Check registry consistency with evaluations
        run: python evaluations/runner/run.py --registry

  metadata:
    name: Validate Skill Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check all skills have metadata.yaml
        run: |
          errors=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            if [ ! -f "${dir}metadata.yaml" ]; then
              echo "❌ Missing metadata.yaml in $dir"
              errors=$((errors + 1))
            fi
            if [ ! -f "${dir}SKILL.md" ]; then
              echo "❌ Missing SKILL.md in $dir"
              errors=$((errors + 1))
            fi
            if [ ! -d "${dir}examples" ]; then
              echo "❌ Missing examples/ in $dir"
              errors=$((errors + 1))
            fi
            if [ ! -d "${dir}eval" ]; then
              echo "❌ Missing eval/ in $dir"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors errors"
            exit 1
          fi
          echo "✅ All skill modules have required structure"
